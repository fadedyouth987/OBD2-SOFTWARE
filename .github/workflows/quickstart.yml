# A-DX-1 + Task 0.1 gate: a fresh checkout must bootstrap, pass tests and lint, and bring up
# healthy infrastructure inside 15 minutes. GitHub runners can pull from Docker Hub, which the
# agent sandbox cannot, so this job is where the Task 0.1 infrastructure gate runs.
name: quickstart

on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Bootstrap
        run: just bootstrap
      - name: Lint
        run: just lint
      # Infrastructure first, so the database tests (Task 2.1 RLS gate) run
      # instead of skipping.
      - name: Infrastructure gate (Task 0.1)
        run: just infra-gate
      - name: Test
        run: just test
      - name: Stop infrastructure
        if: always()
        run: just infra-down -v
      - name: Build web
        run: cd apps/web && pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # A-DES gates: session flow, state table, copilot evidence, axe + 44 px targets.
      - name: Install Playwright Chromium
        run: cd apps/web && pnpm exec playwright install --with-deps chromium
      - name: Web end-to-end tests
        run: cd apps/web && pnpm e2e --trace off

  # A-ENG-1: the J2534 bridge is a 32-bit Windows process. Build it for
  # i686-pc-windows-msvc and run its round trip through the daemon's adapter.
  # The hardware variant (real vendor DLL) is on the A-ENG-10 release checklist.
  j2534-bridge-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain with the 32-bit Windows target
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc
      - name: Bridge round trip (32-bit)
        run: cargo test -p j2534-bridge --locked --target i686-pc-windows-msvc
