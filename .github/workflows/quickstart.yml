# A-DX-1 + Task 0.1 gate: a fresh checkout must bootstrap, pass tests and lint, and bring up
# healthy infrastructure inside 15 minutes. GitHub runners can pull from Docker Hub, which the
# agent sandbox cannot, so this job is where the Task 0.1 infrastructure gate runs.
name: quickstart

on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Bootstrap
        run: just bootstrap
      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Build web
        run: cd apps/web && pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Infrastructure gate (Task 0.1)
        run: just infra-gate --down
