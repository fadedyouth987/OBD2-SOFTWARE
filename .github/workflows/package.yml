# Task 5.1 gate: release builds for x86_64-unknown-linux-gnu and
# x86_64-pc-windows-msvc, the installers, and post-install tests of the installed
# service: loopback-only listen, unpaired and wrong-origin connections refused,
# a technician's pairing code accepted, everything else in the data folder out
# of a technician's reach, upgrade and uninstall behaviour.
#
# Build jobs hold no secrets and are unsigned. Signing runs only for v* tags, in
# separate jobs bound to the protected `release` environment, whose secrets are:
#   Linux:   LINUX_SIGNING_KEY (ASCII-armored GPG private key), LINUX_SIGNING_KEY_PASSPHRASE
#   Windows: WINDOWS_CERT_PFX (base64 PFX, Authenticode), WINDOWS_CERT_PASSWORD
name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Release build
        run: cargo build -p edge-daemon --release --locked --target "$TARGET"
      - name: Package
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version' apps/edge-daemon/Cargo.toml | cut -d'"' -f2)
          NAME="edge-daemon-$VER-$TARGET"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/edge-daemon" apps/edge-daemon/packaging/linux/* "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Install as a system service
        run: |
          set -euo pipefail
          sudo "dist/$NAME/install.sh"
          systemctl is-active obd2-edge-daemon.service
          # Service-only data; only pairing/ is shared with the obd2-edge group.
          test "$(sudo stat -c '%a %U:%G' /var/lib/obd2-edge)" = "710 obd2-edge:obd2-edge"
          test "$(sudo stat -c '%a %U:%G' /var/lib/obd2-edge/pairing)" = "2770 obd2-edge:obd2-edge"
      - name: A technician pairs; others can't, and service data stays out of reach
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash -G obd2-edge tech
          sudo useradd -m -s /bin/bash other
          # sudo drops EDGE_DATA_DIR and skips profile.d: pair must find the service anyway.
          CODE=$(sudo -u tech edge-daemon pair | sed -n 's/^Pairing code: //p')
          test -n "$CODE"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          if sudo -u other edge-daemon pair; then echo "a non-member paired"; exit 1; fi
          if sudo -u tech ls /var/lib/obd2-edge >/dev/null 2>&1; then echo "tech can list the data folder"; exit 1; fi
          if sudo -u tech test -w /var/lib/obd2-edge; then echo "tech can write the data folder"; exit 1; fi
          for f in /var/lib/obd2-edge/logs/edge-daemon.log /var/lib/obd2-edge/audit.jsonl; do
            if sudo test -e "$f" && sudo -u tech test -r "$f"; then echo "tech can read $f"; exit 1; fi
          done
      - name: Post-install smoke test
        run: |
          sudo "$(command -v node)" scripts/smoke-installed-daemon.mjs \
            --pair-code "$CODE" --log /var/lib/obd2-edge/logs/edge-daemon.log
      - name: Upgrade keeps the edited origin file and the data
        run: |
          set -euo pipefail
          echo "# edited by the workshop" | sudo tee -a /etc/obd2-edge/edge-daemon.env >/dev/null
          sudo "dist/$NAME/install.sh"
          grep -q "edited by the workshop" /etc/obd2-edge/edge-daemon.env
          systemctl is-active obd2-edge-daemon.service
          test "$(sudo stat -c '%a' /var/lib/obd2-edge)" = "710"
      - name: Uninstall keeps data; --purge removes it
        run: |
          set -euo pipefail
          sudo "dist/$NAME/uninstall.sh"
          if systemctl is-active --quiet obd2-edge-daemon.service; then echo "service still active"; exit 1; fi
          if (exec 3<>/dev/tcp/127.0.0.1/8765) 2>/dev/null; then echo "port 8765 still listening"; exit 1; fi
          sudo test -d /var/lib/obd2-edge
          getent passwd obd2-edge >/dev/null
          sudo "dist/$NAME/uninstall.sh" --purge
          if sudo test -e /var/lib/obd2-edge; then echo "data left after --purge"; exit 1; fi
      - name: Service logs
        if: failure()
        run: sudo journalctl -u obd2-edge-daemon.service --no-pager | tail -n 100
      - uses: actions/upload-artifact@v4
        with:
          name: edge-daemon-linux
          path: dist/*.tar.gz*

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain with the Windows targets
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Release builds (daemon x64, J2534 bridge 32-bit)
        run: |
          cargo build -p edge-daemon --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build -p j2534-bridge --release --locked --target i686-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build MSI (WiX v4)
        run: |
          dotnet tool install --global wix --version 4.0.5
          $ver = (Select-String -Path apps\edge-daemon\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = "dist\edge-daemon-$ver-x86_64-pc-windows-msvc.msi"
          wix build apps\edge-daemon\packaging\windows\edge-daemon.wxs -arch x64 -d Version=$ver `
            -d DaemonExe=target\x86_64-pc-windows-msvc\release\edge-daemon.exe `
            -d BridgeExe=target\i686-pc-windows-msvc\release\j2534-bridge.exe -o $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MSI=$msi" >> $env:GITHUB_ENV
      - name: Install the MSI
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', (Resolve-Path $env:MSI), '/qn', '/l*v', "$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 80; exit $p.ExitCode }
          (Get-Service RootCauseEdgeDaemon).WaitForStatus('Running', '00:00:30')
          $account = (Get-CimInstance Win32_Service -Filter "Name='RootCauseEdgeDaemon'").StartName
          if ($account -ne 'NT SERVICE\RootCauseEdgeDaemon') { throw "service runs as $account" }
          $data = (Get-Acl C:\ProgramData\RootCauseOBD).Access | ForEach-Object { "$($_.IdentityReference)" }
          if ($data -match 'Users|Everyone|Technicians') { throw "data folder grants: $($data -join ', ')" }
          $pair = (Get-Acl C:\ProgramData\RootCauseOBD\pairing).Access | ForEach-Object { "$($_.IdentityReference)" }
          if (-not ($pair -match 'RootCause Technicians')) { throw "pairing folder grants: $($pair -join ', ')" }
      - name: A standard user in the technicians group pairs; service data stays out of reach
        run: |
          $pw = ConvertTo-SecureString ("T1!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          New-LocalUser tech -Password $pw -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'RootCause Technicians' -Member tech
          $cred = New-Object System.Management.Automation.PSCredential('tech', $pw)
          $out = 'C:\Users\Public\pair.txt'
          # A fresh process as tech, without EDGE_DATA_DIR set by hand: pair must find the service.
          $p = Start-Process 'C:\Program Files\RootCauseOBD\edge-daemon.exe' -ArgumentList 'pair' -Credential $cred `
            -WorkingDirectory C:\Users\Public -RedirectStandardOutput $out -LoadUserProfile -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "pair as tech exited $($p.ExitCode)" }
          $code = (Select-String -Path $out -Pattern 'Pairing code: (\d{6})').Matches[0].Groups[1].Value
          "CODE=$code" >> $env:GITHUB_ENV
          $w = Start-Process powershell -ArgumentList '-NoProfile', '-Command', `
            'try { Set-Content C:\ProgramData\RootCauseOBD\probe.txt x -ErrorAction Stop; exit 0 } catch { exit 3 }' `
            -Credential $cred -WorkingDirectory C:\Users\Public -LoadUserProfile -Wait -PassThru
          if ($w.ExitCode -ne 3) { throw "tech could write the service data folder (exit $($w.ExitCode))" }
      - name: Post-install smoke test
        run: |
          node scripts/smoke-installed-daemon.mjs --pair-code $env:CODE --log C:\ProgramData\RootCauseOBD\logs\edge-daemon.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The service stops and starts on request
        run: |
          Restart-Service RootCauseEdgeDaemon
          (Get-Service RootCauseEdgeDaemon).WaitForStatus('Running', '00:00:30')
          node scripts/smoke-installed-daemon.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Service logs
        if: failure()
        run: |
          Get-Content C:\ProgramData\RootCauseOBD\logs\edge-daemon.log -Tail 100 -ErrorAction SilentlyContinue
          Get-WinEvent -LogName System -MaxEvents 30 | Where-Object ProviderName -eq 'Service Control Manager' | Format-List TimeCreated, Message
      - name: Uninstall stops the daemon
        run: |
          $p = Start-Process msiexec -ArgumentList '/x', (Resolve-Path $env:MSI), '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Get-Service RootCauseEdgeDaemon -ErrorAction SilentlyContinue) { throw "service still installed" }
          if (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue) { throw "port 8765 still listening" }
      - name: Checksums
        run: Get-ChildItem dist\*.msi | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File "$_.sha256" -Encoding ascii }
      - uses: actions/upload-artifact@v4
        with:
          name: edge-daemon-windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: edge-daemon-windows-binaries
          path: |
            target/x86_64-pc-windows-msvc/release/edge-daemon.exe
            target/i686-pc-windows-msvc/release/j2534-bridge.exe

  # Release signing: tags only, in the protected `release` environment (add
  # required reviewers and the secrets there). Secrets reach only the steps
  # that sign; no build or dependency code runs with them.
  sign-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edge-daemon-linux
          path: dist
      - name: Detached GPG signature
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$LINUX_SIGNING_KEY" || { echo "::error::LINUX_SIGNING_KEY is not set in the release environment"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
          for f in dist/*.tar.gz; do
            printf '%s' "$LINUX_SIGNING_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$f"
          done
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v4
        with:
          name: edge-daemon-linux-signed
          path: dist/*

  sign-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-daemon-windows-binaries
          path: target
      - name: Sign executables, build and sign the MSI (Authenticode)
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { throw "WINDOWS_CERT_PFX is not set in the release environment" }
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          # Imported into the job's user store, so no password goes on a command line.
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $sign = { param($files) & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint $files; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          $exe = Get-ChildItem target -Recurse -Include edge-daemon.exe, j2534-bridge.exe | ForEach-Object FullName
          & $sign $exe
          dotnet tool install --global wix --version 4.0.5
          $ver = (Select-String -Path apps\edge-daemon\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = "dist\edge-daemon-$ver-x86_64-pc-windows-msvc.msi"
          $daemon = $exe | Where-Object { $_ -like '*edge-daemon.exe' }
          $bridge = $exe | Where-Object { $_ -like '*j2534-bridge.exe' }
          wix build apps\edge-daemon\packaging\windows\edge-daemon.wxs -arch x64 -d Version=$ver -d DaemonExe=$daemon -d BridgeExe=$bridge -o $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $sign $msi
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"
          Get-ChildItem dist\*.msi | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File "$_.sha256" -Encoding ascii }
      - uses: actions/upload-artifact@v4
        with:
          name: edge-daemon-windows-signed
          path: dist/*
