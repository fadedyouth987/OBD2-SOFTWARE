name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo test --workspace

  j2534-bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: i686-pc-windows-msvc
      - run: cargo test -p j2534-bridge --target i686-pc-windows-msvc

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install fastapi uvicorn httpx pydantic pydantic-settings cryptography
      - run: python3 scripts/run_simulation_check.py
      - run: PYTHONPATH=services/cloud-api python3 -m unittest services/cloud-api/tests/test_tasks_2_2_to_3_3.py
      - run: PYTHONPATH=services/ai-worker python3 -m unittest services/ai-worker/tests/test_graph_and_vision.py

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
