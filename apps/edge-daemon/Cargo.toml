[package]
name = "edge-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local edge daemon: vehicle adapters, diagnostic protocols, safety interlock, loopback WebSocket"

[lints]
workspace = true

[lib]
name = "edge_daemon"
path = "src/lib.rs"

[[bin]]
name = "edge-daemon"
path = "src/main.rs"

# Task 0.2: wire protocol. More dependencies arrive with Phase 1 tasks (1.1 onward).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pattern validation inside the typify-generated newtypes.
regress = "0.12"
# Validates every incoming message against edge_ws.schema.json before serde,
# so Rust enforces the same bounds as the Zod validators.
jsonschema = { version = "0.61", default-features = false }
