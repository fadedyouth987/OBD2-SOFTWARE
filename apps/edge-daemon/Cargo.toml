[package]
name = "edge-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local edge daemon: vehicle adapters, diagnostic protocols, safety interlock, loopback WebSocket"

[lints]
workspace = true

[lib]
name = "edge_daemon"
path = "src/lib.rs"

[[bin]]
name = "edge-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "process", "net", "signal"] }
# Local WebSocket server (Task 1.4).
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Leases and cloud pairing tokens: Ed25519 JWS, verified without a general JWT library (Task 1.4).
ed25519-dalek = "3"
base64 = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# No libudev: port enumeration falls back to /sys, so the daemon builds without system packages.
serialport = { version = "4.10", default-features = false }
# Local telemetry ring buffer (Task 1.3); bundled SQLite, no system library needed.
rusqlite = { version = "0.43", features = ["bundled"] }
# Safety tokens: random value, bound to the SHA-256 of the request payload (Task 1.2).
sha2 = "0.11"
getrandom = "0.4"
# Wire protocol of the 32-bit J2534 bridge process (A-ENG-1).
j2534-bridge = { path = "../j2534-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pattern validation inside the typify-generated newtypes.
regress = "0.12"
# Validates every incoming message against edge_ws.schema.json before serde,
# so Rust enforces the same bounds as the Zod validators.
jsonschema = { version = "0.61", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
tokio-tungstenite = "0.30"
