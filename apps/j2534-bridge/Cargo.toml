[package]
name = "j2534-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "32-bit J2534 PassThru bridge process for the edge daemon (A-ENG-1)"

[lints]
workspace = true

[lib]
name = "j2534_bridge"
path = "src/lib.rs"

[[bin]]
name = "j2534-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Maintained fork of j2534 0.3 (0.3.1 no longer compiles: unaligned packed-field references).
j2534 = { package = "j2534-mrw", version = "0.3.6" }

[dev-dependencies]
# The round-trip test drives this bridge through the daemon's real J2534 adapter.
edge-daemon = { path = "../edge-daemon" }
tokio = { version = "1.54", features = ["rt", "macros", "time"] }
