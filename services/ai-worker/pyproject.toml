[project]
name = "ai-worker"
version = "0.1.0"
description = "Celery worker for schematic ingestion and ML pipelines"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
